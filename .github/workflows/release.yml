# Build, test and publish the Windows, macOS and Linux apps as a GitHub Release.
# Only ever runs when you ask for it:
#   GitHub -> Actions -> "Release builds" -> Run workflow -> enter a version (e.g. 0.3.0)
# or push a tag:  git tag v0.3.0 && git push origin v0.3.0
#
# The builds go through exactly the same tests as the pre-merge "Build check"; nothing is published
# unless all three platforms pass. Every release is kept; an existing version is refused, never replaced.
name: Release builds

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.3.0). Must be higher than the last one."
        required: true
        type: string
      prerelease:
        description: "Mark as a pre-release (not shown as the latest version)"
        type: boolean
        default: false
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only the repository owner may publish, and only code that is already on main.
          if [ "$GITHUB_ACTOR" != "$GITHUB_REPOSITORY_OWNER" ]; then
            echo "::error::Only the repository owner ($GITHUB_REPOSITORY_OWNER) can publish releases."; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" != "push" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases can only be built from main (run the workflow on the main branch)."; exit 1
          fi
          STATUS=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          if [ "$STATUS" != "identical" ] && [ "$STATUS" != "behind" ]; then
            echo "::error::Commit $GITHUB_SHA is not on main (status: $STATUS). Merge it into main first."; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then V="${GITHUB_REF_NAME#v}"; else V="${INPUT_VERSION#v}"; fi
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must look like 1.2.3 (got '$V')."; exit 1
          fi
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v$V already exists. Existing releases are never overwritten - pick a new version."; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Releasing version $V"

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      upload_installers: true

  release:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
      actions: write    # delete the hand-off artifacts afterwards
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: gridfinity-custom-bin-*
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        run: |
          ls -lh release
          FLAGS=""
          if [ "$PRERELEASE" = "true" ]; then FLAGS="--prerelease"; fi
          gh release create "v$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Gridfinity Custom Bin $VERSION" \
            --generate-notes $FLAGS

      # The installers now live on the release. Remove the copies used to pass them between jobs
      # so they do not sit in artifact storage.
      - name: Delete hand-off artifacts
        if: always()
        continue-on-error: true
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate \
            --jq '.artifacts[] | select(.name | startswith("gridfinity-custom-bin-")) | .id' |
          while read -r id; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" && echo "deleted artifact $id"
          done
