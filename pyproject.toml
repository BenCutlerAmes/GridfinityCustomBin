[project]
name = "tooltracer"
dynamic = ["version"]
description = "Local photo-to-Gridfinity tool tracer: photograph tools on paper, get a printable bin with tool-shaped pockets."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "opencv-python>=4.10",
    "numpy>=2.0",
    "shapely>=2.0",
    "manifold3d>=3.0",
    "pillow>=11.0",
    "pillow-heif>=0.20",
    "platformdirs>=4.14.5",
    "pywebview>=5 ; sys_platform != 'linux'",
    "pywebview[qt]>=5 ; sys_platform == 'linux'",
    "certifi>=2026.10.23",
]

[project.optional-dependencies]
ai = ["onnxruntime>=1.20"]

[project.scripts]
tooltracer = "tooltracer.launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "tooltracer/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["tooltracer"]

[dependency-groups]
build = ["pyinstaller>=6.10"]
